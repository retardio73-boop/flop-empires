[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "flop-empires"
version = "0.1.0"
description = "Deterministic FLOP Empires protocol referee and simulator"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "PyNaCl>=1.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
flop-empires = "flop_empires.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
